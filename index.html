<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-time Object Detection</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { position: relative; display: inline-block; max-width: 100%; }
        video { display: none; }
        canvas { border: 2px solid #38bdf8; border-radius: 8px; max-width: 100%; height: auto; }
        #status { margin-top: 10px; font-weight: bold; color: #38bdf8; min-height: 1.4em; text-align: center; }
        #stats { margin-top: 4px; color: #94a3b8; font-size: 14px; min-height: 1.2em; }
        .controls { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; margin-top: 16px; padding: 14px 18px; background: #1e293b; border-radius: 8px; }
        .control { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        .control label { color: #cbd5e1; }
        select, input[type=range], button { font: inherit; }
        select { padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        select:disabled, button:disabled { opacity: 0.5; }
        button { padding: 7px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; cursor: pointer; }
        button:hover:not(:disabled) { border-color: #38bdf8; }
        input[type=range] { width: 200px; accent-color: #38bdf8; }
        :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>

    <h2>Real-time stream detection</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>
    <div id="status">Connecting to backend...</div>
    <div id="stats"></div>

    <div class="controls">
        <div class="control">
            <label for="mode">Mode</label>
            <select id="mode">
                <option value="fast">Fast (YOLO26s, Objects365)</option>
                <option value="accurate">Accurate (YOLO26x, Objects365)</option>
            </select>
        </div>
        <div class="control">
            <label for="conf">Confidence threshold: <span id="confValue">40%</span></label>
            <input id="conf" type="range" min="0.10" max="0.95" step="0.05" value="0.40">
        </div>
        <div class="control" id="cameraControl" hidden>
            <label for="flipCam">Camera: <span id="camName">back</span></label>
            <button id="flipCam" type="button">&#x1F504; Switch camera</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const statsDiv = document.getElementById('stats');
        const modeSelect = document.getElementById('mode');
        const confSlider = document.getElementById('conf');
        const confValue = document.getElementById('confValue');
        const cameraControl = document.getElementById('cameraControl');
        const flipBtn = document.getElementById('flipCam');
        const camName = document.getElementById('camName');

        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');

        // Served by the backend: same host and port. Opened as a file: localhost:8000.
        const wsProto = location.protocol === "https:" ? "wss" : "ws";
        const wsHost = location.protocol === "file:" ? "localhost:8000" : location.host;
        const wsUrl = `${wsProto}://${wsHost}/ws/detect`;
        let ws;
        try {
            ws = new WebSocket(wsUrl);
        } catch (err) {
            statusDiv.innerText = "Cannot open " + wsUrl + ": " + err.message;
            throw err;
        }
        statusDiv.innerText = "Connecting to " + wsUrl + " ...";
        setTimeout(() => {
            if (ws.readyState === WebSocket.CONNECTING) {
                statusDiv.innerText = "Still connecting to " + wsUrl + ". Check that app.py is running, the firewall allows port 8000, and the certificate is trusted.";
            }
        }, 6000);

        // ---- Speed knobs ----
        // MAX_IN_FLIGHT: frames sent before waiting for a result. 2 hides network latency.
        // SEND_SCALE: upload size relative to the camera frame (0.75 of 640 = 480 wide).
        //             Keep IMGSZ in app.py about equal to the sent width. 1.0 = best accuracy.
        const MAX_IN_FLIGHT = 2;
        const SEND_SCALE = 0.75;
        const JPEG_QUALITY = 0.6;

        let latestDetections = [];
        let inFlight = 0;
        let cameraStarted = false;
        let loopStarted = false;
        let lastResponseAt = 0;
        let fps = 0;

        // Camera state. Phones usually default to the back camera for detection.
        let facing = "environment";   // "environment" = back, "user" = front
        let currentStream = null;

        function sendSettings() {
            if (ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ mode: modeSelect.value, conf: Number(confSlider.value) }));
        }

        confSlider.addEventListener('input', () => {
            confValue.innerText = Math.round(confSlider.value * 100) + "%";
            sendSettings();
        });

        modeSelect.addEventListener('change', () => {
            modeSelect.disabled = true; // re-enabled when the server answers
            latestDetections = [];
            sendSettings();
        });

        flipBtn.addEventListener('click', async () => {
            facing = facing === "environment" ? "user" : "environment";
            flipBtn.disabled = true;
            latestDetections = [];
            await startCamera();
            flipBtn.disabled = false;
        });

        ws.onopen = () => {
            statusDiv.innerText = "Connected! Starting camera...";
            sendSettings();
            if (!cameraStarted) { cameraStarted = true; startCamera(); }
        };

        ws.onmessage = (event) => {
            const r = JSON.parse(event.data);

            // Status or error messages do not count as a processed frame
            if (r.status || r.error) {
                statusDiv.innerText = r.status || r.error;
                if (r.mode) modeSelect.value = r.mode;
                if (r.mode || r.error) modeSelect.disabled = false;
                return;
            }

            latestDetections = r.detections;
            inFlight = Math.max(0, inFlight - 1);
            statusDiv.innerText = "Detecting (" + r.mode + " mode)";

            const now = performance.now();
            if (lastResponseAt) {
                const inst = 1000 / (now - lastResponseAt);
                fps = fps ? fps * 0.9 + inst * 0.1 : inst;
            }
            lastResponseAt = now;
            statsDiv.innerText = fps.toFixed(1) + " FPS, model time " + r.ms + " ms";
        };

        ws.onerror = () => { statusDiv.innerText = "Cannot reach the backend. Is app.py running?"; };
        ws.onclose = () => { inFlight = 0; statusDiv.innerText = "Disconnected from backend."; };

        // Show the switch button only when the device has more than one camera.
        async function updateCameraButton() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter(d => d.kind === "videoinput");
                cameraControl.hidden = cams.length < 2;
            } catch (e) {
                cameraControl.hidden = true;
            }
            camName.innerText = facing === "environment" ? "back" : "front";
        }

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusDiv.innerText = "The camera needs a secure page. Open this page with https:// (run gen_cert.py) or use localhost.";
                return;
            }
            // Release the previous camera first (some phones can only open one at a time)
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facing },
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    }
                });
                currentStream = stream;

                // Trust what the browser actually gave us, when it tells us
                const reported = stream.getVideoTracks()[0].getSettings().facingMode;
                if (reported === "user" || reported === "environment") facing = reported;

                video.onloadedmetadata = () => {
                    // Size can change when switching (portrait vs landscape)
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    hiddenCanvas.width = Math.round(video.videoWidth * SEND_SCALE);
                    hiddenCanvas.height = Math.round(video.videoHeight * SEND_SCALE);
                    if (!loopStarted) { loopStarted = true; requestAnimationFrame(processFrame); }
                };
                video.srcObject = stream;
                await updateCameraButton(); // labels/devices are available after permission
            } catch (err) {
                statusDiv.innerText = "Camera access denied: " + err.message;
            }
        }

        function processFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            latestDetections.forEach(det => {
                // boxes come back in the (downscaled) sent-frame coordinates
                const k = 1 / SEND_SCALE;
                const [x1, y1, x2, y2] = det.box.map(v => v * k);
                ctx.strokeStyle = "#00ff88";
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                ctx.fillStyle = "#00ff88";
                const text = `${det.label} ${Math.round(det.confidence * 100)}%`;
                ctx.font = "16px sans-serif";
                const textWidth = ctx.measureText(text).width;
                ctx.fillRect(x1, y1 > 25 ? y1 - 25 : y1, textWidth + 10, 25);

                ctx.fillStyle = "#000";
                ctx.fillText(text, x1 + 5, y1 > 25 ? y1 - 7 : y1 + 18);
            });

            if (ws.readyState === WebSocket.OPEN && inFlight < MAX_IN_FLIGHT && video.videoWidth > 0) {
                inFlight++;
                hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                hiddenCanvas.toBlob((blob) => {
                    if (blob && ws.readyState === WebSocket.OPEN) ws.send(blob);
                    else inFlight = Math.max(0, inFlight - 1);
                }, 'image/jpeg', JPEG_QUALITY);
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
